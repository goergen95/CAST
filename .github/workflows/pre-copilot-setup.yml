name: Pre-Copilot R setup
on: [push, pull_request]

permissions:
  contents: read

jobs:
  setup-r-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.2'

      - name: Install system libraries (common)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      - name: Install pak from CRAN
        run: |
          R -e "options(repos = c(CRAN = 'https://cran.r-project.org')); install.packages('pak')"

      - name: Install package + dev dependencies using pak
        run: |
          R -e "pak::pkg_install('.', dependencies = TRUE)"
